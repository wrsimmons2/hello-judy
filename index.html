<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hello Judy" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />
  <title>Hello Judy</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-deep:   #0a1628;
      --blue-mid:    #0d2952;
      --blue-bright: #1a5faa;
      --blue-light:  #2e8cdf;
      --gold:        #d4a843;
      --gold-light:  #f0c96a;
      --white:       #f5f0e8;
      --white-dim:   rgba(245,240,232,0.65);
    }

    html, body {
      height: 100%;
      background: var(--blue-deep);
      font-family: 'Source Sans 3', sans-serif;
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── Starfield background ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%,   rgba(26,95,170,0.55) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 20% 100%, rgba(13,41,82,0.8)   0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 80%,  rgba(10,22,40,0.9)   0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* subtle dot-grid texture */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 28px 48px;
    }

    /* ── Header ── */
    .greeting {
      text-align: center;
      margin-bottom: 54px;
      animation: fadeDown 0.9s ease both;
    }

    .greeting-hello {
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 300;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .greeting-name {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(3.4rem, 14vw, 6.5rem);
      line-height: 1;
      color: var(--white);
      text-shadow:
        0 0 60px rgba(46,140,223,0.5),
        0 2px 4px rgba(0,0,0,0.4);
      letter-spacing: -0.01em;
    }

    .greeting-line {
      margin-top: 16px;
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 2px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Menu list ── */
    .menu {
      list-style: none;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: fadeUp 0.9s 0.25s ease both;
    }

    .menu-item a {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 22px 28px;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      text-decoration: none;
      color: var(--white);
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 600;
      font-size: clamp(1.25rem, 5vw, 1.55rem);
      letter-spacing: 0.04em;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      position: relative;
      overflow: hidden;
    }

    /* shimmer on tap/hover */
    .menu-item a::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.08) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.4s ease;
    }
    .menu-item a:hover::after,
    .menu-item a:active::after { transform: translateX(100%); }

    .menu-item a:hover,
    .menu-item a:active {
      background: rgba(46,140,223,0.18);
      border-color: var(--blue-light);
      transform: scale(1.02);
    }

    .menu-bullet {
      width: 10px; height: 10px;
      background: var(--gold);
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px var(--gold);
    }

    .menu-arrow {
      margin-left: auto;
      font-size: 1.3rem;
      opacity: 0.4;
    }

    /* ── Footer ── */
    .footer {
      margin-top: auto;
      padding-top: 48px;
      font-size: 0.75rem;
      color: rgba(245,240,232,0.25);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      animation: fadeUp 1s 0.5s ease both;
    }

    /* ── Animations ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="greeting">
      <div class="greeting-hello">Hello</div>
      <div class="greeting-name">Judy</div>
      <div class="greeting-line"></div>
    </header>

    <ul class="menu">

      <li class="menu-item">
        <a href="kindle/index.html">
          <span class="menu-bullet"></span>
          KINDLE 4
          <span class="menu-arrow">›</span>
        </a>
      </li>

      <!-- ── ADD MORE SECTIONS HERE ──
           Copy the <li> block above, change the href and label.
           Example:
      <li class="menu-item">
        <a href="photos/index.html">
          <span class="menu-bullet"></span>
          PHOTOS
          <span class="menu-arrow">›</span>
        </a>
      </li>
      -->

    </ul>

    <footer class="footer">Judy's Guide &nbsp;·&nbsp; Updated by Bill</footer>

  </div>
</body>
</html>
